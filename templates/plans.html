{% extends "base.html" %}{% block content %}<h1>Subscription plans</h1><p>Sample prices for academic demonstration. Payment is simulated.</p><div class="grid">{% for p in plans %}<article><h2>{{p.plan_name}}</h2><h2>₹{{p.price}}</h2><p>{{p.duration_days}} days</p><p>{{p.description or ""}}</p><form method="post" action="/subscribe/{{p.plan_id}}"><button>Choose plan</button></form></article>{% else %}<p>No plans. Run seed.py.</p>{% endfor %}</div>{% endblock %}
